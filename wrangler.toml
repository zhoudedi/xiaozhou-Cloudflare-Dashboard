# xiaozhou-Cloudflare-Dashboard — Cloudflare 管理面板（Module Worker）
# 二开自：fangovo/cloudflare-Management  v2.9.0
#
# 部署方式（本仓库已接入 Cloudflare 后台 Git 自动构建）：
#   1) 在 Cloudflare Dashboard → Workers & Pages → 该 Worker → Settings → Builds
#      连接本仓库的 main 分支，push 即自动 npx wrangler deploy
#   2) 访问密码用加密 Secret 维护（不要明文写进本文件）：
#      Settings → Variables and Secrets → Add → Secret → ACCESS_PASSWORD
#   3) 首次手动部署：npx wrangler secret put ACCESS_PASSWORD  →  npx wrangler deploy

# ① Worker 名称（全局唯一，与 CF 控制台项目名一致）
name = "xiaozhou-cloudflare-dashboard"

# ② 入口文件：前端 + 后端全部内嵌在这一个文件里
main = "cf-panel-worker-v2.9.0.js"

# ③ 运行时行为版本（锁定，别随意改成 latest）
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# ④ 预置 OAuth 客户端 ID（32 位 hex，公开标识，非敏感）
#    配置后所有浏览器无需手动填写；OAuth 应用注册见 OAUTH.md
[vars]
OAUTH_CLIENT_ID = "d2a54c9a8c235bdd733c4d65671a3904"

# ⑤ 批量创建 Worker 的内置模板存储（"批量创建"页使用）
#    namespace 标题：xiaozhou-Cloudflare-Dashboard-kv
[[kv_namespaces]]
binding = "CF_ACCOUNTS_KV"
id = "1319d93193094c5c9b8fd42027b7b999"

# ⑥ 可选：会话落库，可精确吊销；不绑也能用（无状态签名 + 7 天过期）
# 如需启用：wrangler kv namespace create SESSIONS，把 id 填入下方
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "<SESSIONS namespace id>"

# 访问密码 ACCESS_PASSWORD 只以加密 Secret 形式存在，绝不写入本文件。
